[project]
name = "kp"
version = "0.1.0"
description = "Real-time RF-DETR keypoint control loop for gesture-driven games"
requires-python = ">=3.10,<3.13"
dependencies = [
    "rfdetr>=1.3.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "torch>=2.4",
    "pyobjc-framework-avfoundation>=12.2.2 ; sys_platform == 'darwin'",
]

[project.scripts]
kp = "kpapp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpapp"]
